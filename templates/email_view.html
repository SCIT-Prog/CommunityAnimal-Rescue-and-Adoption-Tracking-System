{% extends 'staff_base.html' %}{% block body %}<div class="page-head"><div><div class="eyebrow">Email log</div><h1>Email {{ e.ref or '' }}</h1></div></div><div class="card"><dl><dt>To</dt><dd>{{ e.to_email }}</dd><dt>Subject</dt><dd>{{ e.subject }}</dd><dt>Status</dt><dd><span class="tag">{{ e.status|replace('_',' ') }}</span> {{ e.error or '' }}</dd><dt>When</dt><dd>{{ e.created_at }}</dd></dl><pre class="mail">{{ e.body }}</pre></div><a class="btn alt" href="{{ url_for('emails') }}">Back to Email log</a>{% endblock %}
