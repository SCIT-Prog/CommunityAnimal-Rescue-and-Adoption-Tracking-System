{% macro fields(fs, vals, csrf) %}<input type="hidden" name="_csrf" value="{{ csrf }}">
{% for f in fs %}<div class="fld{{ ' wide' if f.t=='textarea' or f.t=='file' }}"><label for="f_{{ f.n }}">{{ f.l }}{% if f.r %} *{% endif %}</label>
{% if f.t=='select' %}<select id="f_{{ f.n }}" name="{{ f.n }}" {{ 'required' if f.r }}><option value="">— select —</option>{% for v,l in f.o %}<option value="{{ v }}" {{ 'selected' if (vals.get(f.n)|string)==(v|string) }}>{{ l }}</option>{% endfor %}</select>
{% elif f.t=='textarea' %}<textarea id="f_{{ f.n }}" name="{{ f.n }}" rows="3" {{ 'required' if f.r }}>{{ vals.get(f.n) or '' }}</textarea>
{% else %}<input id="f_{{ f.n }}" name="{{ f.n }}" type="{{ f.t }}" {% if f.t=='number' %}step="0.1" min="0"{% endif %}{% if f.t=='file' %}accept="image/*" data-preview{% endif %}{% if f.dl %}list="dl_{{ f.n }}" autocomplete="off"{% endif %} value="{{ vals.get(f.n) or '' }}" {{ 'required' if f.r }}>{% if f.dl %}<datalist id="dl_{{ f.n }}">{% for h in f.dl %}<option value="{{ h }}">{% endfor %}</datalist>{% endif %}{% endif %}</div>{% endfor %}{% endmacro %}
{% macro pic(p, species, cls='') %}{% if p %}<img class="pic {{ cls }}" src="{{ url_for('static', filename='uploads/' + p) }}" alt="Photo of {{ species }}" loading="lazy">{% else %}<div class="pic ph {{ cls }}" role="img" aria-label="No photo available">{{ icon('paw',56) }}</div>{% endif %}{% endmacro %}
