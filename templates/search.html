{% extends 'staff_base.html' %}{% block body %}<div class="page-head"><div><div class="eyebrow">Find anything</div><h1>Search</h1></div></div><form class="row card" method="get"><div style="flex:3"><label for="q">Animals, rescue reports, people, requests, or a reference like R-0012</label><input id="q" name="q" value="{{ s }}" autofocus></div><div><button>{{ icon('search',17) }} Search</button></div></form>
{% if s and not groups %}<div class="card">Nothing found for “{{ s }}”.</div>{% endif %}
{% for title, rows in groups %}<h2>{{ title }}</h2><div class="card">{% for t, sub, u in rows %}<div><a href="{{ u }}">{{ t }}</a> <span class="mut">· {{ sub }}</span></div>{% endfor %}</div>{% endfor %}{% endblock %}
